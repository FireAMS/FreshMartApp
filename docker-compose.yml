
services:
  fruit-service:
    build: ./product
    volumes:
      - ./product:/usr/src/app
    ports:
      - "5001:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy 

  vegetable-service:
    build: ./vegetable
    volumes: 
      - ./vegetable:/usr/src/app
    ports:
      - "5003:80" 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3  
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD} 
    depends_on:
      db:
        condition: service_healthy 


  website:
    image: php:apache
    volumes:
      - ./website:/var/www/html
    ports: 
      - "5002:80"
    environment:
      FRUIT_SERVICE_URL: ${FRUIT_SERVICE_URL}
      VEG_SERVICE_URL: ${VEG_SERVICE_URL}      
    depends_on:
      fruit-service:
        condition: service_healthy
      vegetable-service:
        condition: service_healthy

  db: 
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: f${DB_NAME}
    volumes:
      - PGDATA:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

volumes:
  PGDATA:       

