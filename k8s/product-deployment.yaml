apiVersion: apps/v1
kind: Deployment
metadata:
  name: fruit-service
  namespace: freshmart
  labels:
    app: fruit-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fruit-service
  template:
    metadata:
      labels:
        app: fruit-service
    spec:
      containers:
      - name: fruit-service
        image: fireams/fruit-service:latest
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: db-configmap
              key: DB_HOST
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DB_NAME
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fruit-service          # must match the hostname the website calls
  namespace: freshmart
spec:
  selector:
    app: fruit-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
