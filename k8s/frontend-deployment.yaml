apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: freshmart
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: freshmart-website:local   # built locally, see steps (or fireams/freshmart-website:latest once CI pushes it)
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: FRUIT_SERVICE_URL
          value: http://fruit-service:80
        - name: VEG_SERVICE_URL
          value: http://vegetable-service:80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: freshmart
spec:
  type: NodePort          # the only service reachable from outside the cluster
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30500


    



